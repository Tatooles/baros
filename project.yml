name: Baros
options:
  bundleIdPrefix: com.kevintatooles
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    MARKETING_VERSION: 1.3
    # Xcode Cloud overrides CFBundleVersion for archive uploads.
    CURRENT_PROJECT_VERSION: 1
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.1.3
  ClerkConvex:
    url: https://github.com/clerk/clerk-convex-swift
    from: 0.1.0
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 9.23.0
schemes:
  BarosUnitTests:
    build:
      targets:
        Baros: all
    test:
      config: Debug
      targets:
        - BarosTests
    run:
      config: Debug
targets:
  Baros:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    attributes:
      DevelopmentTeam: RJGJJ38RV9
      ProvisioningStyle: Automatic
    sources:
      - path: Baros
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: ClerkConvex
        product: ClerkConvex
      - package: ConvexMobile
        product: ConvexMobile
      - package: Sentry
        product: Sentry
      - target: BarosLiveActivity
    postBuildScripts:
      - name: Write Build Source Metadata
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          metadata_path="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/BuildSourceMetadata.plist"

          if [ "${CONFIGURATION}" != "Debug" ]; then
            rm -f "${metadata_path}"
            exit 0
          fi

          mkdir -p "$(dirname "${metadata_path}")"

          branch="Unknown"
          short_commit=""
          has_local_changes="NO"

          if /usr/bin/git -C "${SRCROOT}" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            branch="$(/usr/bin/git -C "${SRCROOT}" symbolic-ref --short HEAD 2>/dev/null || true)"
            if [ -z "${branch}" ]; then
              branch="Detached HEAD"
            fi

            short_commit="$(/usr/bin/git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || true)"

            if ! /usr/bin/git -C "${SRCROOT}" diff --quiet --ignore-submodules -- 2>/dev/null; then
              has_local_changes="YES"
            fi
            if ! /usr/bin/git -C "${SRCROOT}" diff --cached --quiet --ignore-submodules -- 2>/dev/null; then
              has_local_changes="YES"
            fi
            if [ -n "$(/usr/bin/git -C "${SRCROOT}" ls-files --others --exclude-standard 2>/dev/null)" ]; then
              has_local_changes="YES"
            fi
          fi

          rm -f "${metadata_path}"
          /usr/bin/plutil -create xml1 "${metadata_path}"
          /usr/bin/plutil -insert Branch -string "${branch}" "${metadata_path}"
          /usr/bin/plutil -insert ShortCommit -string "${short_commit}" "${metadata_path}"
          /usr/bin/plutil -insert HasLocalChanges -bool "${has_local_changes}" "${metadata_path}"
          /usr/bin/plutil -insert BuiltAt -string "$(/bin/date '+%Y-%m-%d %H:%M:%S %z')" "${metadata_path}"
          /usr/bin/plutil -insert Configuration -string "${CONFIGURATION}" "${metadata_path}"
      - name: Upload Debug Symbols to Sentry
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(TARGET_NAME)
        script: |
          set -euo pipefail

          # A normal Release build does not require upload credentials. Archives do.
          if [ "${CONFIGURATION}" != "Release" ] || [ "${ACTION}" != "install" ]; then
            exit 0
          fi

          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "error: SENTRY_AUTH_TOKEN is required to upload archive dSYMs"
            exit 1
          fi

          if ! command -v sentry-cli >/dev/null 2>&1; then
            echo "error: sentry-cli is required to upload archive dSYMs"
            exit 1
          fi

          export SENTRY_ORG=kevin-tatooles
          export SENTRY_PROJECT=baros-ios
          sentry-cli debug-files upload "${DWARF_DSYM_FOLDER_PATH}"
    settings:
      base:
        # The Write Build Source Metadata script reads .git and writes into the
        # app bundle, neither of which user script sandboxing permits.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # dSYMs in Debug too, so Instruments can symbolicate profiling traces.
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        PRODUCT_NAME: Baros
        PRODUCT_BUNDLE_IDENTIFIER: com.kevintatooles.LiftingLog.dev
        CODE_SIGN_ENTITLEMENTS: Baros/Baros.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RJGJJ38RV9
        APP_DISPLAY_NAME: Baros Dev
        BAROS_ENVIRONMENT: Development
        SENTRY_ENABLED: NO
        SENTRY_DSN: ""
        CLERK_PUBLISHABLE_KEY: pk_test_Z2xhZC1rcmlsbC0yMi5jbGVyay5hY2NvdW50cy5kZXYk
        CLERK_ASSOCIATED_DOMAIN: webcredentials:glad-krill-22.clerk.accounts.dev
        CONVEX_DEPLOYMENT_URL: https://glad-cow-603.convex.cloud
        INFOPLIST_FILE: Baros/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.kevintatooles.LiftingLog
          APP_DISPLAY_NAME: Baros
          BAROS_ENVIRONMENT: Production
          SENTRY_ENABLED: YES
          SENTRY_DSN: https://7e078530be3bfc7c45aaeecc13fc5cab@o4511860701855744.ingest.us.sentry.io/4511860712210432
          CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuYmFyb3MuZml0JA
          CLERK_ASSOCIATED_DOMAIN: webcredentials:clerk.baros.fit
          CONVEX_DEPLOYMENT_URL: https://sensible-reindeer-16.convex.cloud
          EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    scheme:
      testTargets:
        - BarosTests
        - BarosUITests
  BarosLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    attributes:
      DevelopmentTeam: RJGJJ38RV9
      ProvisioningStyle: Automatic
    sources:
      - path: BarosLiveActivity
      - path: Baros/Shared/LiveActivity
      - path: Baros/Shared/DesignSystem/BarosBrand.swift
    settings:
      base:
        PRODUCT_NAME: BarosLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: com.kevintatooles.LiftingLog.dev.LiveActivity
        INFOPLIST_FILE: BarosLiveActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RJGJJ38RV9
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.kevintatooles.LiftingLog.LiveActivity

  BarosTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BarosTests
    dependencies:
      - target: Baros
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_NAME: BarosTests
        GENERATE_INFOPLIST_FILE: YES
  BarosUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BarosUITests
    dependencies:
      - target: Baros
    settings:
      base:
        PRODUCT_NAME: BarosUITests
        GENERATE_INFOPLIST_FILE: YES
