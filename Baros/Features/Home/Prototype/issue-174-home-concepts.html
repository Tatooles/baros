<!doctype html>
<!--
  PROTOTYPE — throwaway code for GitHub issue #174.
  Question: Which supporting content and information hierarchy makes Home useful
  without turning it into a general dashboard?
  Three variants are switchable with ?variant=A|B|C; ?state=inactive|active
  controls the workout state. Run from the repository root with:
  python3 -m http.server 8000
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baros Home Concepts — Issue 174</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f7f6f3;
      --surface: #ffffff;
      --recessed: #f2f2f4;
      --field: #ececf0;
      --ink: #101319;
      --secondary: #666b74;
      --tertiary: #90949c;
      --blue: #1c66c7;
      --blue-bright: #1768e5;
      --blue-muted: #e9f1fb;
      --border: rgba(9, 18, 29, 0.09);
      --shadow: 0 14px 32px rgba(0, 0, 0, 0.08);
      --radius: 26px;
      --safe-bottom: max(22px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 8%, rgba(28, 102, 199, 0.12), transparent 30%),
        #dfe3e8;
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px 12px 116px;
    }

    button, a { font: inherit; }
    button { color: inherit; }

    .phone {
      width: min(430px, 100%);
      height: min(860px, calc(100vh - 180px));
      min-height: 560px;
      background: var(--canvas);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(18, 25, 34, 0.22);
      position: relative;
      isolation: isolate;
    }

    .screen {
      position: absolute;
      inset: 0;
      overflow: auto;
      padding: 30px 16px 112px;
      scrollbar-width: none;
    }
    .screen::-webkit-scrollbar { display: none; }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--secondary);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 18px; font-size: 36px; line-height: 1.03; letter-spacing: -0.04em; }
    h2 { margin-bottom: 10px; font-size: 20px; letter-spacing: -0.02em; }
    h3 { margin-bottom: 5px; font-size: 17px; }
    .muted { color: var(--secondary); }
    .small { font-size: 13px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .primary {
      border: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--blue), var(--blue-bright));
      color: white;
      font-weight: 800;
      padding: 16px 20px;
      min-height: 54px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(28, 102, 199, 0.26);
    }

    .secondary-button {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: var(--blue);
      font-weight: 750;
      padding: 13px 16px;
      cursor: pointer;
    }

    .link-button {
      border: 0;
      background: transparent;
      color: var(--blue);
      padding: 0;
      font-weight: 750;
      cursor: pointer;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 25px 2px 10px;
    }
    .section-heading h2 { margin: 0; }

    .hero-a {
      width: 100%;
      min-height: 122px;
      padding: 22px 24px;
      border: 0;
      border-radius: 32px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      background:
        radial-gradient(circle at 86% 16%, rgba(255,255,255,0.22), transparent 28%),
        linear-gradient(145deg, #155bb8, #1768e5 64%, #0e4b9c);
      color: white;
      box-shadow: 0 18px 40px rgba(28, 102, 199, 0.28);
      overflow: hidden;
      position: relative;
      text-align: left;
      cursor: pointer;
    }

    .hero-a strong { display: block; font-size: 31px; letter-spacing: -0.04em; }
    .hero-a span span { display: block; margin-top: 7px; color: rgba(255,255,255,0.74); font-size: 14px; font-weight: 650; }
    .hero-a .hero-arrow { font-size: 38px; font-weight: 300; color: rgba(255,255,255,0.82); }

    .workout-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 0;
      background: var(--surface);
      text-align: left;
      padding: 16px;
      cursor: pointer;
    }
    .workout-row + .workout-row { border-top: 1px solid var(--border); }
    .accent-stick { width: 4px; height: 58px; border-radius: 4px; background: var(--blue); flex: none; }
    .row-copy { min-width: 0; flex: 1; }
    .row-copy strong { display: block; font-size: 16px; margin-bottom: 4px; }
    .row-copy span { color: var(--secondary); font-size: 13px; }
    .chevron { color: var(--tertiary); font-size: 23px; }

    .greeting {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .greeting h1 { margin: 0; }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--blue-muted);
      color: var(--blue);
      font-weight: 800;
    }

    .routine-card {
      padding: 22px;
      overflow: hidden;
      position: relative;
    }
    .routine-card::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      right: -72px;
      top: -80px;
      background: var(--blue-muted);
    }
    .routine-card .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      color: var(--blue);
      background: var(--blue-muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 17px;
    }
    .routine-card h2 { font-size: 25px; margin-bottom: 7px; }
    .routine-card p { color: var(--secondary); line-height: 1.45; margin-bottom: 20px; }
    .routine-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .routine-actions .primary { width: 100%; }

    .week-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      padding: 15px;
    }
    .day { text-align: center; color: var(--tertiary); font-size: 11px; font-weight: 700; }
    .day b {
      width: 32px;
      height: 32px;
      margin: 7px auto 0;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--recessed);
      color: var(--secondary);
      font-size: 12px;
    }
    .day.done b { background: var(--blue); color: white; }
    .day.today b { outline: 2px solid rgba(28,102,199,0.24); color: var(--blue); }

    .training-card { padding: 14px; }
    .training-action {
      width: 100%;
      min-height: 112px;
      border: 0;
      border-radius: 22px;
      padding: 21px;
      background: linear-gradient(135deg, var(--blue), var(--blue-bright));
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      cursor: pointer;
    }
    .training-action strong { display: block; font-size: 25px; letter-spacing: -0.03em; }
    .training-action span span { display: block; margin-top: 5px; color: rgba(255,255,255,0.72); font-size: 13px; font-weight: 650; }
    .training-action .chevron { color: rgba(255,255,255,0.82); font-size: 32px; }
    .training-week-heading { display: flex; justify-content: space-between; margin: 18px 4px 0; font-size: 13px; font-weight: 800; }
    .training-card .week-strip { padding: 12px 0 0; }

    .rail-action {
      width: 100%;
      min-height: 126px;
      padding: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: 9px 1fr auto;
      align-items: center;
      border: 0;
      text-align: left;
      cursor: pointer;
    }
    .rail-action::before { content: ""; align-self: stretch; background: var(--blue); }
    .rail-action-copy { padding: 22px; }
    .rail-action-copy strong { display: block; color: var(--ink); font-size: 28px; letter-spacing: -0.035em; }
    .rail-action-copy span { display: block; color: var(--secondary); margin-top: 6px; font-size: 13px; font-weight: 650; }
    .rail-action .chevron { color: var(--blue); font-size: 34px; padding-right: 22px; }

    .overview-top {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .action-tile {
      padding: 21px;
      color: white;
      background: linear-gradient(145deg, #155bb8, #1768e5);
      border: 0;
      text-align: left;
      cursor: pointer;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .action-tile .round-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(255,255,255,0.16);
      font-size: 25px;
    }
    .action-tile h2 { font-size: 23px; margin: 0 0 5px; }
    .action-tile p { margin: 0; color: rgba(255,255,255,0.72); font-size: 13px; }

    .stat-stack { display: grid; gap: 12px; }
    .stat {
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 89px;
    }
    .stat strong { font-size: 25px; letter-spacing: -0.04em; }
    .stat span { color: var(--secondary); font-size: 12px; font-weight: 700; margin-top: 3px; }

    .activity-list { overflow: hidden; }

    .tab-bar {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 88px;
      padding: 10px 9px var(--safe-bottom);
      background: rgba(250,250,250,0.92);
      border-top: 1px solid rgba(0,0,0,0.08);
      backdrop-filter: blur(24px);
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      align-items: start;
    }
    .tab {
      border: 0;
      background: transparent;
      color: var(--tertiary);
      display: grid;
      justify-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 650;
    }
    .tab .tab-icon { font-size: 21px; line-height: 1; }
    .tab.selected { color: var(--blue); }
    .tab.active-workout { color: var(--blue); }

    .scrim {
      position: absolute;
      z-index: 30;
      inset: 0;
      background: rgba(0,0,0,0.34);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: absolute;
      z-index: 31;
      left: 8px;
      right: 8px;
      bottom: 8px;
      max-height: calc(100% - 48px);
      overflow-y: auto;
      padding: 10px 18px 26px;
      border-radius: 36px;
      background: var(--surface);
      box-shadow: 0 -16px 45px rgba(0,0,0,0.18);
      transform: translateY(calc(100% + 24px));
      transition: transform 220ms cubic-bezier(.2,.8,.2,1);
    }
    .sheet.open { transform: translateY(0); }
    .grabber { width: 38px; height: 5px; border-radius: 4px; background: #d0d2d7; margin: 0 auto 20px; }
    .sheet h2 { font-size: 25px; margin-bottom: 18px; }
    .choice-list { display: grid; gap: 10px; }
    .choice {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--canvas);
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 13px;
      text-align: left;
      cursor: pointer;
    }
    .choice-icon {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--blue-muted);
      color: var(--blue);
      font-size: 22px;
      flex: none;
    }
    .choice-copy { flex: 1; }
    .choice-copy strong { display: block; }
    .coming-soon { opacity: 0.6; cursor: not-allowed; }
    .badge {
      border-radius: 999px;
      padding: 6px 8px;
      background: var(--field);
      color: var(--secondary);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .past-picker { display: none; }
    .past-review { display: none; }
    .sheet.show-past .chooser { display: none; }
    .sheet.show-past .past-picker { display: block; }
    .sheet.show-review .chooser,
    .sheet.show-review .past-picker { display: none; }
    .sheet.show-review .past-review { display: block; }
    .back {
      border: 0;
      background: transparent;
      color: var(--blue);
      padding: 0 0 12px;
      font-weight: 750;
      cursor: pointer;
    }
    .past-list { overflow: hidden; border-radius: 20px; border: 1px solid var(--border); }
    .past-search {
      width: 100%;
      border: 0;
      border-radius: 16px;
      background: var(--field);
      padding: 13px 15px;
      margin-bottom: 12px;
      font-size: 15px;
      outline: none;
    }
    .review-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 18px 0; }
    .review-metric { padding: 16px; border-radius: 18px; background: var(--recessed); text-align: center; }
    .review-metric strong { display: block; font-size: 21px; }
    .review-metric span { color: var(--secondary); font-size: 12px; font-weight: 700; }
    .past-review .primary { width: 100%; }

    .prototype-controls {
      position: fixed;
      z-index: 100;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px;
      border-radius: 999px;
      color: white;
      background: rgba(12, 17, 24, 0.96);
      box-shadow: 0 14px 34px rgba(0,0,0,0.28);
      font-size: 13px;
      white-space: nowrap;
    }
    .prototype-controls button {
      border: 0;
      color: white;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      min-width: 38px;
      height: 38px;
      padding: 0 12px;
      cursor: pointer;
      font-weight: 750;
    }
    .prototype-controls button.selected { background: var(--blue-bright); }
    .variant-label { min-width: 150px; text-align: center; font-weight: 750; }
    .control-divider { width: 1px; height: 26px; background: rgba(255,255,255,0.18); }

    .toast {
      position: absolute;
      z-index: 40;
      left: 50%;
      bottom: 112px;
      transform: translate(-50%, 18px);
      padding: 11px 16px;
      border-radius: 999px;
      color: white;
      background: rgba(12,17,24,0.92);
      opacity: 0;
      pointer-events: none;
      transition: 180ms ease;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 540px) {
      body { padding: 0 0 104px; background: var(--canvas); display: block; }
      .phone { width: 100%; height: calc(100vh - 96px); min-height: 600px; border: 0; border-radius: 0; box-shadow: none; }
      .prototype-controls { bottom: 12px; max-width: calc(100vw - 16px); }
      .variant-label { min-width: 118px; }
      .prototype-controls button { min-width: 34px; padding: 0 10px; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Baros Home prototype">
    <div id="screen" class="screen"></div>
    <nav id="tabBar" class="tab-bar" aria-label="Prototype app tabs"></nav>
    <div id="scrim" class="scrim"></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Start Workout chooser">
      <div class="grabber"></div>
      <div class="chooser">
        <h2>Start Workout</h2>
        <div class="choice-list">
          <button class="choice" data-action="start-blank">
            <span class="choice-icon">＋</span>
            <span class="choice-copy"><strong>Blank Workout</strong></span>
            <span class="chevron">›</span>
          </button>
          <button class="choice" data-action="show-past">
            <span class="choice-icon">↻</span>
            <span class="choice-copy"><strong>Use Past Workout</strong></span>
            <span class="chevron">›</span>
          </button>
          <button class="choice coming-soon" disabled>
            <span class="choice-icon">▦</span>
            <span class="choice-copy"><strong>Start from Template</strong></span>
            <span class="badge">Coming soon</span>
          </button>
        </div>
      </div>
      <div class="past-picker">
        <button class="back" data-action="back-chooser">‹ Start options</button>
        <h2>Use Past Workout</h2>
        <input id="pastSearch" class="past-search" type="search" placeholder="Search workouts" aria-label="Search past workouts">
        <div class="past-list">
          <button class="workout-row" data-workout-name="Upper Body" data-action="review-past"><span class="accent-stick"></span><span class="row-copy"><strong>Upper Body</strong><span>Mon, Aug 10 · 52 min · 6 exercises</span></span><span class="chevron">›</span></button>
          <button class="workout-row" data-workout-name="Lower Body" data-action="review-past"><span class="accent-stick"></span><span class="row-copy"><strong>Lower Body</strong><span>Sat, Aug 8 · 47 min · 5 exercises</span></span><span class="chevron">›</span></button>
          <button class="workout-row" data-workout-name="Push" data-action="review-past"><span class="accent-stick"></span><span class="row-copy"><strong>Push</strong><span>Wed, Aug 5 · 54 min · 6 exercises</span></span><span class="chevron">›</span></button>
          <button class="workout-row" data-workout-name="Pull" data-action="review-past"><span class="accent-stick"></span><span class="row-copy"><strong>Pull</strong><span>Mon, Aug 3 · 50 min · 5 exercises</span></span><span class="chevron">›</span></button>
        </div>
      </div>
      <div class="past-review">
        <button class="back" data-action="back-past">‹ Past workouts</button>
        <h2>Upper Body</h2>
        <span class="muted small">Completed August 10</span>
        <div class="review-metrics">
          <div class="review-metric"><strong>6</strong><span>Exercises</span></div>
          <div class="review-metric"><strong>18</strong><span>Sets</span></div>
        </div>
        <button class="primary" data-action="confirm-past">Start Workout</button>
      </div>
    </section>
    <div id="toast" class="toast" role="status"></div>
  </main>

  <div class="prototype-controls" aria-label="Prototype controls">
    <button id="previous" aria-label="Previous variant">←</button>
    <span id="variantLabel" class="variant-label"></span>
    <button id="next" aria-label="Next variant">→</button>
    <span class="control-divider"></span>
    <button id="inactiveState">No workout</button>
    <button id="activeState">Active</button>
  </div>

  <script>
    const variants = {
      A: { name: "Focused Launchpad" },
      B: { name: "Routine First" },
      C: { name: "Activity Overview" },
      D: { name: "Unified Training Card" },
      E: { name: "Accent Rail" }
    };

    const params = new URLSearchParams(window.location.search);
    let variant = variants[params.get("variant")] ? params.get("variant") : "A";
    let workoutState = params.get("state") === "active" ? "active" : "inactive";

    const screen = document.getElementById("screen");
    const tabBar = document.getElementById("tabBar");
    const sheet = document.getElementById("sheet");
    const scrim = document.getElementById("scrim");
    const toast = document.getElementById("toast");

    function updateURL() {
      const url = new URL(window.location.href);
      url.searchParams.set("variant", variant);
      url.searchParams.set("state", workoutState);
      window.history.replaceState({}, "", url);
    }

    function renderTabs() {
      const workoutTab = workoutState === "active"
        ? `<button class="tab active-workout" data-action="return-workout"><span class="tab-icon">◴</span><span>Workout</span></button>`
        : "";
      tabBar.innerHTML = `
        <button class="tab"><span class="tab-icon">◷</span><span>History</span></button>
        <button class="tab selected"><span class="tab-icon">⌂</span><span>Home</span></button>
        ${workoutTab}
        <button class="tab"><span class="tab-icon">♙</span><span>Profile</span></button>
      `;
    }

    function primaryAction() {
      return workoutState === "active"
        ? { title: "Return to Workout", detail: "Upper Body · 38 min elapsed", icon: "◴", action: "return-workout" }
        : { title: "Start Workout", detail: "Blank, past workout, or template", icon: "＋", action: "open-chooser" };
    }

    function variantA() {
      const action = primaryAction();
      return `
        <p class="eyebrow">Sunday, August 16</p>
        <h1>Home</h1>
        <button class="hero-a" data-action="${action.action}">
          <span><strong>${action.title}</strong>${workoutState === "active" ? "<span>Upper Body · 38 min elapsed</span>" : ""}</span>
          <span class="hero-arrow">›</span>
        </button>
        <div class="section-heading"><h2>This week</h2><span class="muted small">3 workouts</span></div>
        <section class="card week-strip">
          <div class="day done">M<b>✓</b></div><div class="day">T<b>—</b></div><div class="day done">W<b>✓</b></div><div class="day">T<b>—</b></div><div class="day done">F<b>✓</b></div><div class="day">S<b>—</b></div><div class="day today">S<b>16</b></div>
        </section>
        <div class="section-heading"><h2>Recent workout</h2><button class="link-button" data-action="view-history">View history</button></div>
        <section class="card activity-list">
          <button class="workout-row" data-action="view-history"><span class="accent-stick"></span><span class="row-copy"><strong>Upper Body</strong><span>Aug 10 · 52 min · 6 exercises · 18 sets</span></span><span class="chevron">›</span></button>
        </section>
      `;
    }

    function variantB() {
      const active = workoutState === "active";
      return `
        <div class="greeting">
          <div><p class="eyebrow">Good afternoon</p><h1>Kevin</h1></div>
          <div class="avatar" aria-hidden="true">K</div>
        </div>
        <section class="card routine-card">
          <span class="status-pill">${active ? "● Workout in progress" : "↻ Your usual Sunday"}</span>
          <h2>${active ? "Upper Body" : "Upper Body again?"}</h2>
          <p>${active ? "38 minutes elapsed · 3 of 6 exercises started" : "You completed this workout last Sunday. Repeat it, or choose another way to start."}</p>
          <div class="routine-actions">
            <button class="primary" data-action="${active ? "return-workout" : "open-chooser"}">${active ? "Return to Workout" : "Start Workout"}</button>
            ${active ? "" : `<button class="secondary-button" data-action="start-past" aria-label="Quick start Upper Body">Quick start</button>`}
          </div>
        </section>
        <div class="section-heading"><h2>This week</h2><span class="muted small">3 workouts</span></div>
        <section class="card week-strip">
          <div class="day done">M<b>✓</b></div><div class="day">T<b>—</b></div><div class="day done">W<b>✓</b></div><div class="day">T<b>—</b></div><div class="day done">F<b>✓</b></div><div class="day">S<b>—</b></div><div class="day today">S<b>16</b></div>
        </section>
        <div class="section-heading"><h2>Last workout</h2><button class="link-button" data-action="view-history">Details</button></div>
        <section class="card activity-list">
          <button class="workout-row" data-action="view-history"><span class="accent-stick"></span><span class="row-copy"><strong>Lower Body</strong><span>Friday · 47 min · 5 exercises</span></span><span class="chevron">›</span></button>
        </section>
      `;
    }

    function variantC() {
      const action = primaryAction();
      return `
        <p class="eyebrow">Your training</p>
        <h1>Home</h1>
        <section class="overview-top">
          <button class="card action-tile" data-action="${action.action}">
            <span class="round-icon">${action.icon}</span>
            <span><h2>${action.title}</h2><p>${action.detail}</p></span>
          </button>
          <div class="stat-stack">
            <div class="card stat"><strong>3</strong><span>Workouts this week</span></div>
            <div class="card stat"><strong>2h 31m</strong><span>Time trained</span></div>
          </div>
        </section>
        <div class="section-heading"><h2>Recent activity</h2><button class="link-button" data-action="view-history">See all</button></div>
        <section class="card activity-list">
          <button class="workout-row" data-action="view-history"><span class="accent-stick"></span><span class="row-copy"><strong>Lower Body</strong><span>Friday · 47 min · 5 exercises</span></span><span class="chevron">›</span></button>
          <button class="workout-row" data-action="view-history"><span class="accent-stick"></span><span class="row-copy"><strong>Push</strong><span>Wednesday · 54 min · 6 exercises</span></span><span class="chevron">›</span></button>
          <button class="workout-row" data-action="view-history"><span class="accent-stick"></span><span class="row-copy"><strong>Pull</strong><span>Monday · 50 min · 5 exercises</span></span><span class="chevron">›</span></button>
        </section>
      `;
    }

    function variantD() {
      const action = primaryAction();
      return `
        <p class="eyebrow">Sunday, August 16</p>
        <h1>Home</h1>
        <section class="card training-card">
          <button class="training-action" data-action="${action.action}">
            <span><strong>${action.title}</strong>${workoutState === "active" ? "<span>Upper Body · 38 min elapsed</span>" : ""}</span>
            <span class="chevron">›</span>
          </button>
          <div class="training-week-heading"><span>This week</span><span class="muted">3 workouts</span></div>
          <div class="week-strip">
            <div class="day done">M<b>✓</b></div><div class="day">T<b>—</b></div><div class="day done">W<b>✓</b></div><div class="day">T<b>—</b></div><div class="day done">F<b>✓</b></div><div class="day">S<b>—</b></div><div class="day today">S<b>16</b></div>
          </div>
        </section>
        <div class="section-heading"><h2>Recent workout</h2><button class="link-button" data-action="view-history">View history</button></div>
        <section class="card activity-list">
          <button class="workout-row" data-action="view-history"><span class="accent-stick"></span><span class="row-copy"><strong>Upper Body</strong><span>Aug 10 · 52 min · 6 exercises · 18 sets</span></span><span class="chevron">›</span></button>
        </section>
      `;
    }

    function variantE() {
      const action = primaryAction();
      return `
        <p class="eyebrow">Sunday, August 16</p>
        <h1>Home</h1>
        <button class="card rail-action" data-action="${action.action}">
          <span class="rail-action-copy"><strong>${action.title}</strong>${workoutState === "active" ? "<span>Upper Body · 38 min elapsed</span>" : ""}</span>
          <span class="chevron">›</span>
        </button>
        <div class="section-heading"><h2>This week</h2><span class="muted small">3 workouts</span></div>
        <section class="card week-strip">
          <div class="day done">M<b>✓</b></div><div class="day">T<b>—</b></div><div class="day done">W<b>✓</b></div><div class="day">T<b>—</b></div><div class="day done">F<b>✓</b></div><div class="day">S<b>—</b></div><div class="day today">S<b>16</b></div>
        </section>
        <div class="section-heading"><h2>Recent workout</h2><button class="link-button" data-action="view-history">View history</button></div>
        <section class="card activity-list">
          <button class="workout-row" data-action="view-history"><span class="accent-stick"></span><span class="row-copy"><strong>Upper Body</strong><span>Aug 10 · 52 min · 6 exercises · 18 sets</span></span><span class="chevron">›</span></button>
        </section>
      `;
    }

    function render() {
      screen.innerHTML = variant === "A" ? variantA()
        : variant === "B" ? variantB()
        : variant === "C" ? variantC()
        : variant === "D" ? variantD()
        : variantE();
      renderTabs();
      document.getElementById("variantLabel").textContent = `${variant} — ${variants[variant].name}`;
      document.getElementById("inactiveState").classList.toggle("selected", workoutState === "inactive");
      document.getElementById("activeState").classList.toggle("selected", workoutState === "active");
      updateURL();
      screen.scrollTop = 0;
    }

    function setVariant(offset) {
      const keys = Object.keys(variants);
      const index = keys.indexOf(variant);
      variant = keys[(index + offset + keys.length) % keys.length];
      closeSheet();
      render();
    }

    function setState(nextState) {
      workoutState = nextState;
      closeSheet();
      render();
    }

    function openSheet() {
      sheet.classList.remove("show-past", "show-review");
      sheet.classList.add("open");
      scrim.classList.add("open");
    }

    function closeSheet() {
      sheet.classList.remove("open", "show-past", "show-review");
      scrim.classList.remove("open");
    }

    let toastTimer;
    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
    }

    function handleAction(action) {
      if (!action) return;
      if (action === "open-chooser") openSheet();
      if (action === "return-workout") showToast("Would select the Active Workout tab");
      if (action === "view-history") showToast("Would open the relevant History destination");
      if (action === "show-past") sheet.classList.add("show-past");
      if (action === "back-chooser") sheet.classList.remove("show-past");
      if (action === "review-past") sheet.classList.add("show-review");
      if (action === "back-past") sheet.classList.remove("show-review");
      if (action === "start-blank" || action === "start-past" || action === "confirm-past") {
        closeSheet();
        setState("active");
        showToast(action === "start-blank" ? "Blank workout started" : "Past workout started");
      }
    }

    document.addEventListener("click", event => {
      const target = event.target.closest("[data-action]");
      if (target) handleAction(target.dataset.action);
    });
    scrim.addEventListener("click", closeSheet);
    document.getElementById("previous").addEventListener("click", () => setVariant(-1));
    document.getElementById("next").addEventListener("click", () => setVariant(1));
    document.getElementById("inactiveState").addEventListener("click", () => setState("inactive"));
    document.getElementById("activeState").addEventListener("click", () => setState("active"));
    document.getElementById("pastSearch").addEventListener("input", event => {
      const query = event.target.value.trim().toLowerCase();
      document.querySelectorAll("[data-workout-name]").forEach(row => {
        row.hidden = !row.dataset.workoutName.toLowerCase().includes(query);
      });
    });
    document.addEventListener("keydown", event => {
      const tag = document.activeElement?.tagName;
      if (["INPUT", "TEXTAREA"].includes(tag) || document.activeElement?.isContentEditable) return;
      if (event.key === "ArrowLeft") setVariant(-1);
      if (event.key === "ArrowRight") setVariant(1);
      if (event.key === "Escape") closeSheet();
    });

    render();
  </script>
</body>
</html>
