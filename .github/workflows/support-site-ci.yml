name: Support Site CI

on:
  pull_request:
    paths:
      - ".github/workflows/support-site-ci.yml"
      - "SupportSite/**"
      - "docs/release/app-store/**"
      - "docs/release/app-store-submission-pack.md"
      - "docs/release/listing.json"
      - "docs/release/listing-approved.json"
      - "BarosUITests/MarketingScreenshotTests.swift"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/support-site-ci.yml"
      - "SupportSite/**"
      - "docs/release/app-store/**"
      - "docs/release/app-store-submission-pack.md"
      - "docs/release/listing.json"
      - "docs/release/listing-approved.json"
      - "BarosUITests/MarketingScreenshotTests.swift"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  support-site-checks:
    name: support-site-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: SupportSite/pnpm-lock.yaml

      - name: Install support-site dependencies
        run: pnpm --dir SupportSite install --frozen-lockfile

      - name: Check and test support site
        run: |
          pnpm --dir SupportSite run check
          pnpm --dir SupportSite test
