name: Support Site CI

on:
  pull_request:
    paths:
      - ".github/workflows/support-site-ci.yml"
      - "SupportSite/**"
      - "docs/release/app-store/**"
      - "docs/release/app-store-submission-pack.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/support-site-ci.yml"
      - "SupportSite/**"
      - "docs/release/app-store/**"
      - "docs/release/app-store-submission-pack.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  support-site-checks:
    name: support-site-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: SupportSite/pnpm-lock.yaml

      - name: Install support-site dependencies
        run: pnpm --dir SupportSite install --frozen-lockfile

      - name: Check and test support site
        run: |
          pnpm --dir SupportSite run check
          pnpm --dir SupportSite test
