name: App CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pr-ci.yml"
      - "Baros/**"
      - "BarosLiveActivity/**"
      - "BarosTests/**"
      - "BarosUITests/**"
      - "Baros.xcodeproj/**"
      - "LiftingLog.xcodeproj/**"
      - "ci_scripts/**"
      - "convex/auth.config.ts"
      - "project.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-changes:
    name: app-change-detection
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate CI workflow contracts
        run: node --test SupportSite/tests/ci-workflows.test.mjs

      - name: Detect app-relevant changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            diff_range="${BASE_SHA}...${HEAD_SHA}"
          else
            diff_range="${BASE_SHA}..${HEAD_SHA}"
          fi

          if git diff --quiet "${diff_range}" -- \
            .github/workflows/pr-ci.yml \
            'Baros/**' \
            'BarosLiveActivity/**' \
            'BarosTests/**' \
            'BarosUITests/**' \
            'Baros.xcodeproj/**' \
            'LiftingLog.xcodeproj/**' \
            'ci_scripts/**' \
            convex/auth.config.ts \
            project.yml; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  ios-unit-tests:
    name: ios-unit-tests
    needs: app-changes
    if: ${{ !cancelled() && (needs.app-changes.result != 'success' || needs.app-changes.outputs.changed == 'true') }}
    runs-on: ${{ needs.app-changes.outputs.changed == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5

    steps:
      - name: Require successful app change classification
        if: needs.app-changes.result != 'success'
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Show Xcode and simulator environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone 17" || true

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Baros.xcodeproj \
            -scheme BarosUnitTests \
            -derivedDataPath "${RUNNER_TEMP}/BarosDerivedData"

      - name: Run Baros unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Baros.xcodeproj \
            -scheme BarosUnitTests \
            -destination "${IOS_TEST_DESTINATION}" \
            -derivedDataPath "${RUNNER_TEMP}/BarosDerivedData" \
            -resultBundlePath "${RUNNER_TEMP}/BarosTests.xcresult" \
            2>&1 | tee "${RUNNER_TEMP}/BarosTests.log"

      - name: Upload iOS failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BarosTests-xcresult
          path: |
            ${{ runner.temp }}/BarosTests.xcresult
            ${{ runner.temp }}/BarosTests.log
          if-no-files-found: warn
          retention-days: 14

  ios-ui-smoke:
    name: ios-ui-smoke
    needs: app-changes
    if: ${{ !cancelled() && (needs.app-changes.result != 'success' || needs.app-changes.outputs.changed == 'true') }}
    runs-on: ${{ needs.app-changes.outputs.changed == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 35
    env:
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5

    steps:
      - name: Require successful app change classification
        if: needs.app-changes.result != 'success'
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Show Xcode and simulator environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone 17" || true

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Baros.xcodeproj \
            -scheme Baros \
            -derivedDataPath "${RUNNER_TEMP}/BarosUISmokeDerivedData"

      - name: Run Baros UI smoke tests
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild test \
            -project Baros.xcodeproj \
            -scheme Baros \
            -destination "${IOS_TEST_DESTINATION}" \
            -only-testing:BarosUITests/BarosUITests/testLogWorkoutSmoke \
            -only-testing:BarosUITests/BarosUITests/testTabNavigationAndFinishSheetSmoke \
            -only-testing:BarosUITests/BarosUITests/testSettingsEditRequestsSyncInUITestMode \
            -only-testing:BarosUITests/BarosUITests/testDeleteLocalDataReturnsToProfileAfterReset \
            -derivedDataPath "${RUNNER_TEMP}/BarosUISmokeDerivedData" \
            -resultBundlePath "${RUNNER_TEMP}/BarosUISmoke.xcresult" \
            2>&1 | tee "${RUNNER_TEMP}/BarosUISmoke.log"

      - name: Verify UI smoke test count
        env:
          EXPECTED_UI_SMOKE_TEST_COUNT: 4
        run: |
          set -o pipefail
          executed_test_count="$(
            xcrun xcresulttool get test-results summary \
              --path "${RUNNER_TEMP}/BarosUISmoke.xcresult" \
              --compact |
              plutil -extract totalTestCount raw -o - -
          )"
          echo "Executed UI smoke tests: ${executed_test_count}"
          if [[ "${executed_test_count}" != "${EXPECTED_UI_SMOKE_TEST_COUNT}" ]]; then
            echo "Expected ${EXPECTED_UI_SMOKE_TEST_COUNT} UI smoke tests, but executed ${executed_test_count}."
            exit 1
          fi

      - name: Upload UI smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BarosUISmoke-xcresult
          path: |
            ${{ runner.temp }}/BarosUISmoke.xcresult
            ${{ runner.temp }}/BarosUISmoke.log
          if-no-files-found: warn
          retention-days: 14
