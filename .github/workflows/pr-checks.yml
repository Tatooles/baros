name: PR Checks

# Reads only the PR's diff, so it needs no macOS runner and no path filter.
# scripts/pr-checks.mjs holds the rules; scripts/check-changed.sh runs the same ones locally.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-hygiene:
    name: test-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0

      - name: Test the PR check rules
        run: node --test scripts/*.test.mjs

      - name: Check added test lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-checks.mjs hygiene --base "${BASE_SHA}" --head "${HEAD_SHA}"

  pr-size:
    name: pr-size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      report: ${{ steps.measure.outputs.report }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0

      - name: Measure size and test delta
        id: measure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          report="$(node scripts/pr-checks.mjs report --base "${BASE_SHA}" --head "${HEAD_SHA}")"
          echo "report=${report}" >> "${GITHUB_OUTPUT}"
          jq -r '"PR size: \(.label) (\(.lines) changed lines)"' <<<"${report}" >> "${GITHUB_STEP_SUMMARY}"

  # Holds the write token, so it checks nothing out and runs no repository code. It treats the
  # report as untrusted data and accepts only a known label and a comment that starts with the marker.
  pr-size-label:
    name: pr-size-label
    needs: pr-size
    # Fork and Dependabot PRs get a read-only token.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Apply size label and test delta comment
        env:
          REPORT: ${{ needs.pr-size.outputs.report }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- pr-checks:test-delta -->'
          label="$(jq -r '.label' <<<"${REPORT}")"
          case "${label}" in
            size:XS) color=0e8a16 ;;
            size:S) color=5ebd3e ;;
            size:M) color=fbca04 ;;
            size:L) color=fe7d37 ;;
            size:XL) color=d93f0b ;;
            size:XXL) color=b60205 ;;
            *) echo "::error::Unexpected size label in report: ${label}"; exit 1 ;;
          esac
          comment="$(jq -r '.comment // empty' <<<"${REPORT}")"
          if [[ -n "${comment}" && "${comment}" != "${marker}"* ]]; then
            echo "::error::The test delta comment doesn't start with its marker."
            exit 1
          fi

          gh label create "${label}" --repo "${REPO}" --color "${color}" \
            --description "Changed lines, not counting tests or generated files. See AGENTS.md → PR size." --force

          for current in $(gh api "repos/${REPO}/issues/${PR}/labels" --jq '.[].name | select(startswith("size:"))'); do
            if [[ "${current}" != "${label}" ]]; then
              gh api -X DELETE "repos/${REPO}/issues/${PR}/labels/${current}" --silent
            fi
          done
          gh api -X POST "repos/${REPO}/issues/${PR}/labels" -f "labels[]=${label}" --silent

          existing="$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id")"
          existing="${existing%%$'\n'*}"

          if [[ -n "${comment}" && -n "${existing}" ]]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f "body=${comment}" --silent
          elif [[ -n "${comment}" ]]; then
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f "body=${comment}" --silent
          elif [[ -n "${existing}" ]]; then
            gh api -X DELETE "repos/${REPO}/issues/comments/${existing}" --silent
          fi
