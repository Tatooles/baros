name: App CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/app-ci.yml"
      - "Baros/**"
      - "BarosLiveActivity/**"
      - "BarosTests/**"
      - "BarosUITests/**"
      - "Baros.xcodeproj/**"
      - "LiftingLog.xcodeproj/**"
      - "ci_scripts/**"
      - "convex/auth.config.ts"
      - "project.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-changes:
    name: app-change-detection
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install workflow test dependencies
        run: pnpm --dir SupportSite install --frozen-lockfile

      - name: Validate CI workflow contracts
        run: node --test SupportSite/tests/ci-workflows.test.mjs

      - name: Detect app-relevant changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            diff_range="${BASE_SHA}...${HEAD_SHA}"
          else
            diff_range="${BASE_SHA}..${HEAD_SHA}"
          fi

          if git diff --quiet "${diff_range}" -- \
            .github/workflows/app-ci.yml \
            'Baros/**' \
            'BarosLiveActivity/**' \
            'BarosTests/**' \
            'BarosUITests/**' \
            'Baros.xcodeproj/**' \
            'LiftingLog.xcodeproj/**' \
            'ci_scripts/**' \
            convex/auth.config.ts \
            project.yml; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  ios-unit-tests:
    name: ios-unit-tests
    needs: app-changes
    if: ${{ always() && (needs.app-changes.result != 'success' || needs.app-changes.outputs.changed == 'true') }}
    runs-on: ${{ needs.app-changes.outputs.changed == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      IOS_SIMULATOR_NAME: iPhone 17
      IOS_SIMULATOR_OS: "26.5"

    steps:
      - name: Require successful app change classification
        if: needs.app-changes.result != 'success'
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Show Xcode and simulator environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone 17" || true

      - name: Start booting the iOS simulator
        run: |
          set -o pipefail
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_SIMULATOR_OS//./-}"
          udid="$(
            xcrun simctl list devices available --json |
              jq -er --arg runtime "${runtime}" --arg name "${IOS_SIMULATOR_NAME}" \
                '[.devices[$runtime] // [] | .[] | select(.name == $name)][0].udid'
          )"
          echo "Booting ${IOS_SIMULATOR_NAME} (iOS ${IOS_SIMULATOR_OS}) ${udid} in the background."
          echo "IOS_SIMULATOR_UDID=${udid}" >> "${GITHUB_ENV}"
          echo "IOS_TEST_DESTINATION=platform=iOS Simulator,id=${udid}" >> "${GITHUB_ENV}"
          date +%s > "${RUNNER_TEMP}/simulator-boot-started"
          nohup bash -c '
            xcrun simctl bootstatus "$1" -b > "$2/simulator-boot.log" 2>&1
            echo "$?" > "$2/simulator-boot-exit"
            date +%s > "$2/simulator-boot-finished"
          ' _ "${udid}" "${RUNNER_TEMP}" > /dev/null 2>&1 &

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.5-${{ hashFiles('Baros.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.5-

      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
              -project Baros.xcodeproj \
              -scheme BarosUnitTests \
              -derivedDataPath "${RUNNER_TEMP}/BarosDerivedData" \
              -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages"; then
              exit 0
            fi
            echo "Package resolution attempt ${attempt} failed."
            sleep 20
          done
          exit 1

      - name: Build Baros unit tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Baros.xcodeproj \
            -scheme BarosUnitTests \
            -destination "${IOS_TEST_DESTINATION}" \
            -derivedDataPath "${RUNNER_TEMP}/BarosDerivedData" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" \
            2>&1 | tee "${RUNNER_TEMP}/BarosTestsBuild.log"

      - name: Wait for the iOS simulator to finish booting
        run: |
          wait_started="$(date +%s)"
          xcrun simctl bootstatus "${IOS_SIMULATOR_UDID}" -b
          now="$(date +%s)"
          boot_started="$(cat "${RUNNER_TEMP}/simulator-boot-started")"
          echo "Waited $((now - wait_started))s for boot here."
          if [[ -f "${RUNNER_TEMP}/simulator-boot-finished" ]]; then
            boot_finished="$(cat "${RUNNER_TEMP}/simulator-boot-finished")"
            echo "Background boot took $((boot_finished - boot_started))s (exit $(cat "${RUNNER_TEMP}/simulator-boot-exit"))."
          else
            echo "Booted $((now - boot_started))s after the background boot started."
          fi
          tail -n 20 "${RUNNER_TEMP}/simulator-boot.log" || true

      - name: Run Baros unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Baros.xcodeproj \
            -scheme BarosUnitTests \
            -destination "${IOS_TEST_DESTINATION}" \
            -derivedDataPath "${RUNNER_TEMP}/BarosDerivedData" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath "${RUNNER_TEMP}/BarosTests.xcresult" \
            2>&1 | tee "${RUNNER_TEMP}/BarosTests.log"

      - name: Report unit tests that only passed on retry
        run: python3 ci_scripts/report_retried_tests.py "${RUNNER_TEMP}/BarosTests.xcresult"

      - name: Upload iOS failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BarosTests-xcresult
          path: |
            ${{ runner.temp }}/BarosTests.xcresult
            ${{ runner.temp }}/BarosTests.log
            ${{ runner.temp }}/BarosTestsBuild.log
            ${{ runner.temp }}/simulator-boot.log
          if-no-files-found: warn
          retention-days: 14

  ios-ui-smoke:
    name: ios-ui-smoke
    needs: app-changes
    if: ${{ always() && (needs.app-changes.result != 'success' || needs.app-changes.outputs.changed == 'true') }}
    runs-on: ${{ needs.app-changes.outputs.changed == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 35
    env:
      IOS_SIMULATOR_NAME: iPhone 17
      IOS_SIMULATOR_OS: "26.5"

    steps:
      - name: Require successful app change classification
        if: needs.app-changes.result != 'success'
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Show Xcode and simulator environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone 17" || true

      - name: Start booting the iOS simulator
        run: |
          set -o pipefail
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_SIMULATOR_OS//./-}"
          udid="$(
            xcrun simctl list devices available --json |
              jq -er --arg runtime "${runtime}" --arg name "${IOS_SIMULATOR_NAME}" \
                '[.devices[$runtime] // [] | .[] | select(.name == $name)][0].udid'
          )"
          echo "Booting ${IOS_SIMULATOR_NAME} (iOS ${IOS_SIMULATOR_OS}) ${udid} in the background."
          echo "IOS_SIMULATOR_UDID=${udid}" >> "${GITHUB_ENV}"
          echo "IOS_TEST_DESTINATION=platform=iOS Simulator,id=${udid}" >> "${GITHUB_ENV}"
          date +%s > "${RUNNER_TEMP}/simulator-boot-started"
          nohup bash -c '
            xcrun simctl bootstatus "$1" -b > "$2/simulator-boot.log" 2>&1
            echo "$?" > "$2/simulator-boot-exit"
            date +%s > "$2/simulator-boot-finished"
          ' _ "${udid}" "${RUNNER_TEMP}" > /dev/null 2>&1 &

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.5-${{ hashFiles('Baros.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.5-

      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
              -project Baros.xcodeproj \
              -scheme Baros \
              -derivedDataPath "${RUNNER_TEMP}/BarosUISmokeDerivedData" \
              -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages"; then
              exit 0
            fi
            echo "Package resolution attempt ${attempt} failed."
            sleep 20
          done
          exit 1

      - name: Build Baros UI smoke tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Baros.xcodeproj \
            -scheme Baros \
            -destination "${IOS_TEST_DESTINATION}" \
            -derivedDataPath "${RUNNER_TEMP}/BarosUISmokeDerivedData" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" \
            2>&1 | tee "${RUNNER_TEMP}/BarosUISmokeBuild.log"

      - name: Wait for the iOS simulator to finish booting
        run: |
          wait_started="$(date +%s)"
          xcrun simctl bootstatus "${IOS_SIMULATOR_UDID}" -b
          now="$(date +%s)"
          boot_started="$(cat "${RUNNER_TEMP}/simulator-boot-started")"
          echo "Waited $((now - wait_started))s for boot here."
          if [[ -f "${RUNNER_TEMP}/simulator-boot-finished" ]]; then
            boot_finished="$(cat "${RUNNER_TEMP}/simulator-boot-finished")"
            echo "Background boot took $((boot_finished - boot_started))s (exit $(cat "${RUNNER_TEMP}/simulator-boot-exit"))."
          else
            echo "Booted $((now - boot_started))s after the background boot started."
          fi
          tail -n 20 "${RUNNER_TEMP}/simulator-boot.log" || true

      - name: Run Baros UI smoke tests
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Baros.xcodeproj \
            -scheme Baros \
            -destination "${IOS_TEST_DESTINATION}" \
            -only-testing:BarosUITests/BarosUITests/testLogWorkoutSmoke \
            -only-testing:BarosUITests/BarosUITests/testTabNavigationAndFinishSheetSmoke \
            -only-testing:BarosUITests/BarosUITests/testSettingsEditRequestsSyncInUITestMode \
            -only-testing:BarosUITests/BarosUITests/testDeleteLocalDataReturnsToSettingsAfterReset \
            -derivedDataPath "${RUNNER_TEMP}/BarosUISmokeDerivedData" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath "${RUNNER_TEMP}/BarosUISmoke.xcresult" \
            2>&1 | tee "${RUNNER_TEMP}/BarosUISmoke.log"

      - name: Report UI smoke tests that only passed on retry
        run: python3 ci_scripts/report_retried_tests.py "${RUNNER_TEMP}/BarosUISmoke.xcresult"

      - name: Verify UI smoke test count
        env:
          EXPECTED_UI_SMOKE_TEST_COUNT: 4
        run: |
          set -o pipefail
          executed_test_count="$(
            xcrun xcresulttool get test-results summary \
              --path "${RUNNER_TEMP}/BarosUISmoke.xcresult" \
              --compact |
              plutil -extract totalTestCount raw -o - -
          )"
          echo "Executed UI smoke tests: ${executed_test_count}"
          if [[ "${executed_test_count}" != "${EXPECTED_UI_SMOKE_TEST_COUNT}" ]]; then
            echo "Expected ${EXPECTED_UI_SMOKE_TEST_COUNT} UI smoke tests, but executed ${executed_test_count}."
            exit 1
          fi

      - name: Upload UI smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BarosUISmoke-xcresult
          path: |
            ${{ runner.temp }}/BarosUISmoke.xcresult
            ${{ runner.temp }}/BarosUISmoke.log
            ${{ runner.temp }}/BarosUISmokeBuild.log
            ${{ runner.temp }}/simulator-boot.log
          if-no-files-found: warn
          retention-days: 14
