name: Convex CI

on:
  pull_request:
    paths:
      - ".github/workflows/convex-ci.yml"
      - "convex/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/convex-ci.yml"
      - "convex/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convex-checks:
    name: convex-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Convex tests
        run: pnpm run convex:test

      - name: Run Convex typecheck
        run: pnpm run convex:typecheck
